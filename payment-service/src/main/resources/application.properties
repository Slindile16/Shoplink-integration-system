server.port=8083
payment.simulation.decline=${PAYMENT_SIMULATION_DECLINE:false}
spring.mvc.problemdetails.enabled=true
# External ActiveMQ Classic broker; JSON TextMessages, never Java object serialization.
spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://localhost:61616?connectionTimeout=2000&soTimeout=5000}
spring.activemq.user=${ACTIVEMQ_USER:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}
spring.jms.pub-sub-domain=false
